spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.ecommerce: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

application:
  security:
    cookie:
      secure: true
      same-site: None

rate-limit:
  enabled: true
  trust-proxy: true  # Production is behind a reverse proxy (Nginx/Railway/Render)
  # Auth limits remain strict in prod (same as dev defaults)
  # Adjust public/sensitive if needed based on actual traffic

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: ecommerce-backend
  flyway:
    baseline-on-migrate: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      # jakarta.persistence.schema-generation.scripts.action: create
      # jakarta.persistence.schema-generation.scripts.create-target: src/main/resources/db/migration/V1__init_schema.sql
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

cors:
  # Danh sách origin được phép gọi API (phân tách bằng dấu phẩy để tương thích @Value)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

application:
  security:
    cookie:
      secure: false
      same-site: Lax
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 900000 # 15 minutes (access token)
      refresh-token:
        expiration: 604800000 # 7 days

app:
  shipping:
    flat-fee: ${SHIPPING_FLAT_FEE:30000}

payment:
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:}
    frontend-origin: ${VNPAY_FRONTEND_ORIGIN:http://localhost:5173}

# Avoid signed query strings / JDBC bind values in framework diagnostics.
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.jdbc.core: INFO

server:
  tomcat:
    accesslog:
      enabled: false

rate-limit:
  enabled: true
  trust-proxy: true  # Set to true when deployed

  auth:
    login:
      capacity: 5
      refill-tokens: 5
      refill-duration-seconds: 60
    register:
      capacity: 3
      refill-tokens: 3
      refill-duration-seconds: 60
    refresh:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60
    logout:
      capacity: 20
      refill-tokens: 20
      refill-duration-seconds: 60

  pub:
    capacity: 100
    refill-tokens: 100
    refill-duration-seconds: 60

  sensitive:
    capacity: 30
    refill-tokens: 30
    refill-duration-seconds: 60

  checkout:
    capacity: 10
    refill-tokens: 10
    refill-duration-seconds: 60

  order-read:
    capacity: 60
    refill-tokens: 60
    refill-duration-seconds: 60

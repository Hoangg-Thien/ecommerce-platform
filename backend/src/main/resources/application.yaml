spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: ecommerce-backend
  flyway:
    baseline-on-migrate: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      # jakarta.persistence.schema-generation.scripts.action: create
      # jakarta.persistence.schema-generation.scripts.create-target: src/main/resources/db/migration/V1__init_schema.sql
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  security:
    cookie:
      secure: false
      same-site: Lax
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 900000 # 15 minutes (access token)
      refresh-token:
        expiration: 604800000 # 7 days

momo:
  partner-code: ${MOMO_PARTNER_CODE:mock}
  access-key: ${MOMO_ACCESS_KEY:mock}
  secret-key: ${MOMO_SECRET_KEY:mock}
  api-url: ${MOMO_API_URL:https://test-payment.momo.vn/v2/gateway/api/create}
  redirect-url: ${MOMO_REDIRECT_URL:mock}
  ipn-url: ${MOMO_IPN_URL:mock}

payment:
  momo:
    mock-enabled: true

rate-limit:
  enabled: true
  trust-proxy: true  # Set to true when deployed

  auth:
    login:
      capacity: 5
      refill-tokens: 5
      refill-duration-seconds: 60
    register:
      capacity: 3
      refill-tokens: 3
      refill-duration-seconds: 60
    refresh:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60
    logout:
      capacity: 20
      refill-tokens: 20
      refill-duration-seconds: 60

  pub:
    capacity: 100
    refill-tokens: 100
    refill-duration-seconds: 60

  sensitive:
    capacity: 30
    refill-tokens: 30
    refill-duration-seconds: 60

  checkout:
    capacity: 10
    refill-tokens: 10
    refill-duration-seconds: 60

  order-read:
    capacity: 60
    refill-tokens: 60
    refill-duration-seconds: 60

  mock-payment:
    capacity: 10
    refill-tokens: 10
    refill-duration-seconds: 60
